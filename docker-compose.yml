version: "3.9"

services:
  db:
    image: postgres:16
    container_name: datalens-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: datalens_db
      POSTGRES_USER: datalens_user
      POSTGRES_PASSWORD: datalens_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: datalens-backend

    command: tail -f /dev/null

    volumes:
      - ./backend:/app
      - media_data:/app/media

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db

volumes:
  postgres_data:
  media_data: